<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在线咨询 - 福建漳州东山渔见鲜水产有限公司</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="site-root">
  <header class="site-header" id="site-header"></header>
  <main class="site-main">

    <section class="page-hero">
      <div class="ph"><div class="ph-label"><b>占位图</b>在线咨询 Banner<br>建议 1920×260</div></div>
      <div class="cap"><h1>在线咨询</h1><p>ONLINE CONSULTATION</p></div>
    </section>

    

    <section class="sub-page-section">
      <div class="container" style="max-width:800px;">
        <div class="contact-form-wrap">
          <h3>在线咨询留言</h3>
          <p class="tips">请填写您的需求，我们将安排专人与您对接（批发 / 零售 / 电商 / 餐饮供货均可咨询）。</p>
          <form id="contact-form">
            <div class="form-grid" style="grid-template-columns:1fr 1fr;">
              <div class="form-row"><input type="text" placeholder="姓名" required></div>
              <div class="form-row"><input type="text" placeholder="联系电话" required></div>
              <div class="form-row full"><input type="text" placeholder="咨询类型（如：批发 / 零售 / 餐饮供货）"></div>
              <div class="form-row full"><textarea placeholder="需求描述" required></textarea></div>
            </div>
            <button type="submit" class="btn btn-primary" style="min-width:200px;">提交咨询</button>
            <div class="form-ok" id="form-ok">✓ 咨询已提交（演示）</div>
          </form>
        </div>
      </div>
    </section>

  </main>
  <footer class="site-footer" id="site-footer"></footer>
</div>
<script src="assets/js/site.js?v=20260905g"></script>
</body>
</html>
